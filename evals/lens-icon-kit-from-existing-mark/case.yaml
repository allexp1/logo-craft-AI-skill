schema_version: "1.1"
name: lens-icon-kit-from-existing-mark
expected_outcome: |
  The existing mark is audited (check_logo.py report and a small-size inspection sheet) with specific, honest findings about small-size behaviour (the amber square's low contrast on white, the ring and square count) and no redesign of the mark itself; a complete icon kit is exported with export_kit.py (favicon.svg with dark-mode rule, favicon.ico 16/32/48, PWA 192/512 plus maskable, apple-touch-icon 180, iOS/macOS 1024 light/dark/tinted with Icon Composer layers, Android adaptive foreground/background/monochrome, OG 1200x630) plus a head.html snippet and a README saying where each file goes for a Tauri app and a website.
context:
  scaffold_script: place-files.sh
