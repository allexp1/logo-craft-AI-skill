name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install an SVG renderer and a system font
        run: sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin fonts-dejavu-core zip unzip
      - name: Build checks
        run: bash scripts/build.sh --check
      - name: Smoke tests
        run: bash scripts/test.sh
